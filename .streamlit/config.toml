[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
enableStaticServing = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
primaryColor = '#002C5F'
backgroundColor = '#FFFFFF'
secondaryBackgroundColor = '#F8F9FB'
textColor = '#111827'
font = 'sans serif'
