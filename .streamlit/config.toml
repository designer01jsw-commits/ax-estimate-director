[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
enableStaticServing = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
primaryColor = '#CF4500'
backgroundColor = '#F3F0EE'
secondaryBackgroundColor = '#FCFBFA'
textColor = '#141413'
font = 'sans serif'
